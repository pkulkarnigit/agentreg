name: Refresh catalog

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch: {} # allow a manual run from the Actions tab

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build crawler
        run: go build -o bin/crawler ./cmd/crawler

      # Discovery only — no -publish here. This runner has no way to
      # reach a self-hosted registry running on someone's own machine, so
      # this job's only job is keeping the checked-in catalog snapshot
      # (browsable at /catalog on any running instance) current. Mirroring
      # into a specific live registry is a separate, local concern — see
      # the README's "Catalog and mirror" section.
      - name: Crawl
        run: ./bin/crawler

      - name: Commit catalog if it changed
        run: |
          if git diff --quiet -- catalog/agent-plugins-catalog.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog/agent-plugins-catalog.json
          git commit -m "Refresh catalog (automated)"

          # main gets pushed to often enough (by hand and by other CI)
          # that this checkout can be stale by the time we get here — a
          # plain `git push` failed exactly this way on this workflow's
          # first real run: rejected as non-fast-forward. Rebase onto
          # whatever's newest and retry a few times rather than just
          # failing the whole run over an ordinary race.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) — fetching and rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::failed to push the catalog refresh after 5 attempts"
          exit 1
