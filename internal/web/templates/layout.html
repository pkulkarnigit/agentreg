{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}AgentReg{{end}}</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 960px; margin: 0 auto; padding: 0 1.5rem 3rem; line-height: 1.55; }
  a { color: #6366f1; }

  header { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 0; margin-bottom: 1rem; border-bottom: 1px solid rgba(128,128,128,0.25); }
  header a { text-decoration: none; color: inherit; }
  nav.top { display: flex; gap: 1.5rem; align-items: center; }
  nav.top a.brand { font-weight: 800; font-size: 1.3rem; letter-spacing: -0.02em; }
  nav.top a:not(.brand) { color: #888; font-size: 0.92rem; }
  nav.top a:not(.brand):hover { color: inherit; }
  .tagline { color: #888; font-size: 0.85rem; }

  /* hero */
  .hero { padding: 2.5rem 0 2rem; text-align: center; }
  .hero h1 { font-size: 2.2rem; margin: 0 0 0.5rem; letter-spacing: -0.02em; }
  .hero p.lede { color: #888; font-size: 1.05rem; max-width: 560px; margin: 0 auto 1.75rem; }
  form.search { max-width: 620px; margin: 0 auto 1.25rem; }
  form.search input { width: 100%; padding: 0.75rem 1rem; font-size: 1rem; box-sizing: border-box; border: 1px solid #999; border-radius: 8px; background: transparent; color: inherit; }
  form.search input:focus { outline: 2px solid #6366f1; outline-offset: 1px; }
  .hero-install { display: inline-flex; align-items: center; gap: 0.6rem; font-size: 0.85rem; color: #888; }
  .hero-install code { font-size: 0.9rem; }

  /* stats */
  .stats { display: flex; justify-content: center; gap: 2.5rem; padding: 1.25rem 0 2rem; margin-bottom: 1.5rem; border-bottom: 1px solid rgba(128,128,128,0.25); }
  .stats .stat { text-align: center; }
  .stats .stat .n { display: block; font-size: 1.5rem; font-weight: 700; }
  .stats .stat .l { color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }

  /* cards */
  .card { border: 1px solid rgba(128,128,128,0.4); border-radius: 10px; padding: 1.1rem 1.25rem; margin-bottom: 0.9rem; }
  .card h3 { margin: 0 0 0.3rem; font-size: 1.05rem; }
  .card h3 a { text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .card p.desc { margin: 0 0 0.5rem; }
  .card-stats { display: flex; flex-wrap: wrap; gap: 0.15rem 0.9rem; color: #888; font-size: 0.85rem; }
  .card-stats strong { color: inherit; font-weight: 600; }

  .muted { color: #888; font-size: 0.9rem; }
  .keywords { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.4rem 0; }
  .keywords span { display: inline-block; background: rgba(128,128,128,0.16); border-radius: 4px; padding: 0.1rem 0.5rem; font-size: 0.78rem; }
  code, pre { background: rgba(128,128,128,0.15); border-radius: 4px; }
  code { padding: 0.15rem 0.4rem; font-size: 0.92em; }
  pre { padding: 0.9rem 1rem; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  .install { margin: 1rem 0; }
  table { border-collapse: collapse; width: 100%; }
  td, th { text-align: left; padding: 0.3rem 0.6rem 0.3rem 0; border-bottom: 1px solid rgba(128,128,128,0.3); }
  section { margin-top: 2rem; }
  h2 { font-size: 1.3rem; border-bottom: 1px solid rgba(128,128,128,0.25); padding-bottom: 0.5rem; }

  .badge { display: inline-block; border-radius: 4px; padding: 0.1rem 0.5rem; font-size: 0.8rem; font-weight: 600; }
  .badge.valid { background: rgba(34,197,94,0.2); color: #16a34a; }
  .badge.invalid { background: rgba(239,68,68,0.2); color: #dc2626; }
  .badge.mirrored { background: rgba(59,130,246,0.2); color: #2563eb; }

  /* docs */
  .docs-toc { border: 1px solid rgba(128,128,128,0.3); border-radius: 8px; padding: 1rem 1.25rem; margin: 1.5rem 0 2rem; }
  .docs-toc div { font-weight: 600; margin-bottom: 0.4rem; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.03em; color: #888; }
  .docs-toc ul { columns: 2; margin: 0; padding-left: 1.1rem; }
  .callout { border-left: 3px solid #6366f1; background: rgba(99,102,241,0.08); border-radius: 0 6px 6px 0; padding: 0.75rem 1rem; margin: 1rem 0; }
  .step { margin: 1rem 0; }
  .step > strong { display: block; margin-bottom: 0.3rem; }

  footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid rgba(128,128,128,0.25); color: #888; font-size: 0.85rem; display: flex; justify-content: space-between; }
  footer a { color: inherit; }
</style>
</head>
<body>
<header>
  <nav class="top">
    <a href="/" class="brand">AgentReg</a>
    <a href="/catalog">discovered plugins</a>
    <a href="/docs">docs</a>
  </nav>
  <span class="tagline">a registry for Agent Plugins (skills + MCP servers)</span>
</header>
{{block "content" .}}{{end}}
<footer>
  <span>AgentReg &middot; a registry for <a href="https://agent-plugins.org">Agent Plugins</a></span>
  <span><a href="/docs">documentation</a></span>
</footer>
</body>
</html>
{{end}}
