services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Local-dev-only credentials — fine here because postgres has no
      # published port (below), so it's unreachable outside this
      # compose network. Replace with real secrets (e.g. via an env
      # file or secrets manager, not committed here) before any real
      # deployment.
      POSTGRES_USER: apreg
      POSTGRES_PASSWORD: apreg
      POSTGRES_DB: apreg
    volumes:
      - apreg-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apreg"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    # No published port: only apreg-server (on the compose network) needs
    # to reach this. Use `docker compose exec postgres psql -U apreg` for
    # direct access instead of exposing it to the host.

  apreg-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      APREG_DB_DRIVER: postgres
      APREG_DB_DSN: postgres://apreg:apreg@postgres:5432/apreg?sslmode=disable
    volumes:
      # Blob storage stays on local disk regardless of metadata backend —
      # this volume only ever holds data/blobs/ when APREG_DB_DRIVER=postgres.
      - apreg-blobs:/home/apreg/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Opt-in: an S3-compatible target for trying the s3blob backend locally
  # (`APREG_BLOB_DRIVER=s3`), instead of the local-disk blobs volume above.
  # Not started by a plain `docker compose up` — bring it up explicitly
  # with `docker compose --profile s3 up -d minio`, then point apreg-server
  # at it (see README).
  minio:
    image: minio/minio
    profiles: ["s3"]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - apreg-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  apreg-pgdata:
  apreg-blobs:
  apreg-miniodata:
