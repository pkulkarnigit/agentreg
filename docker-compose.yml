services:
  postgres:
    image: postgres:16-alpine
    environment:
      # POSTGRES_PASSWORD has no hardcoded fallback on purpose: postgres
      # has no published port (below), so a weak password here is only
      # "safe" as long as that stays true — one careless port mapping
      # later and it's an internet-facing default password. The
      # `:?...` form makes `docker compose up` refuse to start at all
      # without a real one, rather than silently accepting a weak
      # default. Copy .env.example to .env and fill it in.
      POSTGRES_USER: krate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD — copy .env.example to .env and fill it in}
      POSTGRES_DB: krate
    volumes:
      - krate-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krate"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    # No published port: only krate-server (on the compose network) needs
    # to reach this. Use `docker compose exec postgres psql -U krate` for
    # direct access instead of exposing it to the host.

  krate-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      KRATE_DB_DRIVER: postgres
      KRATE_DB_DSN: postgres://krate:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD — copy .env.example to .env and fill it in}@postgres:5432/krate?sslmode=disable
    volumes:
      # Blob storage stays on local disk regardless of metadata backend —
      # this volume only ever holds data/blobs/ when KRATE_DB_DRIVER=postgres.
      - krate-blobs:/home/krate/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Opt-in: an S3-compatible target for trying the s3blob backend locally
  # (`KRATE_BLOB_DRIVER=s3`), instead of the local-disk blobs volume above.
  # Not started by a plain `docker compose up` — bring it up explicitly
  # with `docker compose --profile s3 up -d minio`, then point krate-server
  # at it (see README).
  minio:
    image: minio/minio
    profiles: ["s3"]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - krate-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Opt-in: a shared target for rate limiting/login lockout
  # (`KRATE_REDIS_ADDR`), so several krate-server replicas can share one
  # set of buckets/failure counts instead of each keeping its own
  # in-memory copy. Not started by a plain `docker compose up` — bring it
  # up explicitly with `docker compose --profile redis up -d redis`, then
  # point krate-server at it (see README).
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  krate-pgdata:
  krate-blobs:
  krate-miniodata:
